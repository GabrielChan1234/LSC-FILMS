<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>LSC ARCHIVE</title>
        <link rel="stylesheet" href="styles.css" />

        <style>
            body {
                margin: 0;
                background: #ffffff;
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            /* PHONE WRAPPER */
            .phone-wrapper {
                position: relative;
                width: min(740px, 92vw, 92vh);
                aspect-ratio: 1 / 1;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            /* PHONE IMAGE (IMPORTANT FIX: cannot block clicks) */
            .phone-frame {
                position: absolute;
                width: 100%;
                height: 100%;
                object-fit: contain;
                z-index: 1;
                pointer-events: none; /* FIX: image cannot block clicks */
            }

            /* SCREEN */
            .phone-screen {
                position: absolute;
                top: 17%;
                left: 18%;
                width: 64%;
                height: 66%;

                display: flex;
                justify-content: center;
                align-items: center;

                z-index: 2;
            }

            /* TEXT AREA */
            .yews {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                text-align: center;

                color: black;
                font-size: 12px;

                width: 150%;
                height: 100%;
                z-index: 3;
            }

            .yews h2 {
                font-size: 12px;
                letter-spacing: 2px;
                margin: 0 0 10px 0;
            }

            .entry {
                margin-bottom: 18px;
            }

            /* LINKS */
            .link {
                cursor: pointer;
                text-decoration: none;
                position: relative;
                display: inline-block;
            }

            /* BRACKET HOVER EFFECT (FIXED) */
            .link::before,
            .link::after {
                opacity: 0;
                transition: 0.15s ease;
                position: relative;
            }

            .link::before {
                content: "[ ";
            }

            .link::after {
                content: " ]";
            }

            .link:hover::before,
            .link:hover::after {
                opacity: 1;
            }

            /* BACK LINK */
            .back-link {
                cursor: pointer;
                text-decoration: none;
            }

            /* VIDEO */
            .video-overlay {
                position: fixed;
                inset: 0;
                background: black;
                display: none;
                justify-content: center;
                align-items: center;
                z-index: 9999;
            }

            .video-overlay iframe {
                width: 100%;
                height: 100%;
                border: 0;
            }

            /* MOBILE */
            @media (max-width: 768px) {
                .phone-frame {
                    display: none;
                }

                .phone-wrapper {
                    width: 100vw;
                    height: 100vh;
                    aspect-ratio: auto;
                }

                .phone-screen {
                    position: relative;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                }

                .yews {
                    font-size: 14px;
                }
            }

            img {
                -webkit-user-drag: none;
                user-select: none;
                -webkit-touch-callout: none;
            }

            .link {
                color: black;
                text-decoration: none;
            }

            /* visited link (this is what turns it purple) */
            .link:visited {
                color: black;
            }

            /* optional: hover stays clean too */
            .link:hover {
                color: black;
            }

            #backToText {
                font-size: 12px; /* smaller text */
                letter-spacing: 0px;
            }
        </style>
    </head>

    <body>
        <div class="phone-wrapper">
            <img src="images/PHONE-TEMP.png" class="phone-frame" draggable="false" oncontextmenu="return false;" />

            <div class="phone-screen">
                <!-- TEXT VIEW -->
                <div class="yews" id="textView">
                    <img src="images/lscfilmslogo.png" alt="Logo" class="brand-logo" />
                    <h3>&nbsp;</h3>

                    <div class="entry">
                        <p>JOHN REEVES: CHAPTER 3</p>
                        <p>&nbsp;</p>
                        <p>DIRECTOR'S CUT</p>
                        <p>&nbsp;</p>
                        <p>06 06 26</p>
                        <p>&nbsp;</p>
                        <p>DIRECTED BY GABRIEL CHAN</p>
                        <p>&nbsp;</p>
                        <p class="link" id="openTrailer"><b>ACCESS FILES</b></p>
                        <p>&nbsp;</p>
                        <a class="link back-link" href="index.html"><b>HOME</b></a>
                    </div>
                    <div id="countdown" style="margin-top: 20px; font-size: 12px">
                        <span id="days"></span>D <span id="hours"></span>H <span id="minutes"></span>M
                        <span id="seconds"></span>S
                    </div>
                </div>

                <!-- VIDEO VIEW -->
                <div
                    class="video-view"
                    id="videoView"
                    style="
                        display: none;
                        width: 100%;
                        height: 100%;
                        flex-direction: column;
                        justify-content: center;
                        align-items: center;
                        gap: 12px;
                    ">
                    <iframe
                        width="50%"
                        height="25%"
                        src="https://www.youtube.com/embed/oEcLgfU-ZYk"
                        title="video1"
                        allowfullscreen>
                    </iframe>

                    <iframe
                        width="50%"
                        height="25%"
                        src="https://www.youtube.com/embed/Geg_6jggJ2Q"
                        title="video2"
                        allowfullscreen>
                    </iframe>

                    <iframe
                        width="50%"
                        height="25%"
                        src="https://www.youtube.com/embed/Q5yV25_s97I"
                        title="video3"
                        allowfullscreen>
                    </iframe>

                    <p class="link" id="backToText"><b>BACK</b></p>
                </div>
            </div>
        </div>

        <div class="video-overlay" id="videoOverlay">
            <iframe
                src="https://www.youtube.com/embed/Q5yV25_s97I?si=J28wxYA1IDkqgXJO"
                title="PREVIEW 3"
                allow="autoplay; encrypted-media"
                allowfullscreen>
            </iframe>
        </div>

        <script>
            const btn = document.getElementById("openTrailer");

            const textView = document.getElementById("textView");
            const videoView = document.getElementById("videoView");

            const backBtn = document.getElementById("backToText");

            // OPEN VIDEO ARCHIVE
            btn.addEventListener("click", () => {
                textView.style.display = "none";
                videoView.style.display = "flex";
            });

            // BACK TO TEXT VIEW
            backBtn.addEventListener("click", () => {
                videoView.style.display = "none";
                textView.style.display = "flex";
            });
        </script>

        <script>
            const targetDate = new Date("June 6, 2026 09:00:00").getTime();

            function format(num) {
                return num < 10 ? "0" + num : num;
            }

            function updateCountdown() {
                const now = new Date().getTime();
                const distance = targetDate - now;

                if (distance <= 0) {
                    document.getElementById("countdown").innerHTML = "RELEASED";
                    return;
                }

                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
                const minutes = Math.floor((distance / (1000 * 60)) % 60);
                const seconds = Math.floor((distance / 1000) % 60);

                document.getElementById("days").innerText = format(days);
                document.getElementById("hours").innerText = format(hours);
                document.getElementById("minutes").innerText = format(minutes);
                document.getElementById("seconds").innerText = format(seconds);
            }

            setInterval(updateCountdown, 1000);
            updateCountdown();
        </script>
    </body>
</html>
